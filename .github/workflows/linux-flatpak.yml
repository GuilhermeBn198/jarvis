name: Linux Flatpak experimental
on:
  workflow_dispatch:
  push:
    branches: [feat/linux-port]
    paths: ['.github/workflows/linux-flatpak.yml']
permissions:
  contents: read
jobs:
  flatpak:
    name: flatpak-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build tools and pinned runtimes
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$ARCH"
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak-builder --version
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Sdk//49 org.gnome.Platform//49 org.freedesktop.Sdk.Extension.rust-stable//25.08
          python3 - <<'PY' > /tmp/jarvis-runtime-pins
          import json,platform
          for ref,commit in json.load(open('packaging/flatpak/runtime-pins.json'))[platform.machine()].items():
              print(ref,commit)
          PY
          while read -r ref commit; do
            flatpak update --user --noninteractive --commit="$commit" "$ref"
          done < /tmp/jarvis-runtime-pins
      - name: Prepare and build native architecture bundle
        env:
          JARVIS_FLATPAK_BUILDER: host
        run: scripts/build-flatpak.sh "$PWD/dist/flatpak"
      - name: Install and inspect bundled runtime
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          flatpak install --user --noninteractive "dist/flatpak/jarvis-$ARCH.flatpak"
          flatpak run --command=jarvis com.jarvis.overlay --doctor
          test "$(flatpak run --command=/app/lib/jarvis/bin/opencode com.jarvis.overlay --version)" = 1.18.23
          flatpak run --command=python3 com.jarvis.overlay -c 'import sys;sys.path.insert(0,"/app/lib/jarvis/python");import faster_whisper,piper,mcp,httpx,dbus_next,gi;gi.require_version("Atspi","2.0");from gi.repository import Atspi;print("Bundled voice/MCP and AT-SPI imports passed")'
      - name: Upload experimental bundle and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-flatpak-${{ matrix.arch }}
          path: |
            dist/flatpak/*.flatpak
            dist/flatpak/*.sha256
          retention-days: 7
          if-no-files-found: error
