name: Linux package helper tests
on:
  workflow_dispatch:
  push:
    branches: [feat/linux-port, main]
    paths:
      - 'scripts/**'
      - '.github/workflows/linux-package-helper-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/linux-package-helper-tests.yml'
permissions:
  contents: read
jobs:
  package-helper-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate package helpers
        run: |
          python3 -m pytest -q scripts/tests
          python3 -m py_compile scripts/prepare-solus-package.py scripts/tests/test_prepare_solus_package.py
          sh -n scripts/build-package.sh
          sh -n scripts/dnf-install-with-metadata-retry.sh
          sh -n scripts/test-native-solus-upgrade.sh
