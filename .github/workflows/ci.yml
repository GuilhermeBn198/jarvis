name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-voice:
    name: pytest voice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10.12'
          cache: pip
          cache-dependency-path: voice/requirements-dev.txt
      # Os testes não usam faster-whisper (voice/requirements.txt fica fora do CI).
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  pytest-delegate-local:
    name: pytest delegate_local
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_servers/delegate_local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10.12'
          cache: pip
          cache-dependency-path: |
            mcp_servers/delegate_local/requirements.txt
            mcp_servers/delegate_local/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  pytest-win-context:
    name: pytest win_context
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_servers/win_context
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10.12'
          cache: pip
          cache-dependency-path: |
            mcp_servers/win_context/requirements.txt
            mcp_servers/win_context/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  node-test:
    name: node --test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .opencode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: .opencode/package-lock.json
      - run: npm ci
      - run: node --test
