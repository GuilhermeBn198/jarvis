name: Linux native packages
on:
  workflow_dispatch:
  push:
    branches: [feat/linux-port, main]
    paths: ['voice/**', 'gui/**', 'mcp_servers/**', '.opencode/**', 'packaging/**', 'scripts/**', 'jarvis', 'LICENSE', 'opencode.json', '.github/workflows/linux-packages.yml']
  pull_request:
    paths: ['voice/**', 'gui/**', 'mcp_servers/**', '.opencode/**', 'packaging/**', 'scripts/**', 'jarvis', 'LICENSE', 'opencode.json', '.github/workflows/linux-packages.yml']
permissions:
  contents: read
concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: ${{ matrix.family }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: debian, arch: x86_64, runner: ubuntu-24.04, dockerfile: packaging/debian/Dockerfile, image: 'debian:trixie', pattern: 'jarvis-assistant_*.deb'}
          - {family: debian, arch: aarch64, runner: ubuntu-24.04-arm, dockerfile: packaging/debian/Dockerfile, image: 'debian:trixie', pattern: 'jarvis-assistant_*.deb'}
          - {family: ubuntu, arch: x86_64, runner: ubuntu-24.04, dockerfile: packaging/ubuntu/Dockerfile, image: 'ubuntu:24.04', pattern: 'jarvis-assistant_*.deb'}
          - {family: ubuntu, arch: aarch64, runner: ubuntu-24.04-arm, dockerfile: packaging/ubuntu/Dockerfile, image: 'ubuntu:24.04', pattern: 'jarvis-assistant_*.deb'}
          - {family: fedora, arch: x86_64, runner: ubuntu-24.04, dockerfile: packaging/rpm/fedora/Dockerfile, image: 'registry.fedoraproject.org/fedora:44', pattern: 'jarvis-assistant-*.x86_64.rpm'}
          - {family: fedora, arch: aarch64, runner: ubuntu-24.04-arm, dockerfile: packaging/rpm/fedora/Dockerfile, image: 'registry.fedoraproject.org/fedora:44', pattern: 'jarvis-assistant-*.aarch64.rpm'}
          - {family: suse, arch: x86_64, runner: ubuntu-24.04, dockerfile: packaging/rpm/suse/Dockerfile, image: 'opensuse/tumbleweed:latest', pattern: 'jarvis-assistant-*.x86_64.rpm'}
          - {family: suse, arch: aarch64, runner: ubuntu-24.04-arm, dockerfile: packaging/rpm/suse/Dockerfile, image: 'opensuse/tumbleweed:latest', pattern: 'jarvis-assistant-*.aarch64.rpm'}
          - {family: arch, arch: x86_64, runner: ubuntu-24.04, dockerfile: packaging/arch/Dockerfile, image: 'archlinux:base', pattern: 'jarvis-assistant-*.pkg.tar.zst'}
          - {family: rhel, arch: x86_64, runner: ubuntu-24.04, dockerfile: packaging/rpm/rhel/Dockerfile, image: 'almalinux:10', pattern: 'jarvis-assistant-*.x86_64.rpm'}
          - {family: rhel, arch: aarch64, runner: ubuntu-24.04-arm, dockerfile: packaging/rpm/rhel/Dockerfile, image: 'almalinux:10', pattern: 'jarvis-assistant-*.aarch64.rpm'}
          - {family: alpine, arch: x86_64, runner: ubuntu-24.04, dockerfile: packaging/alpine/Dockerfile, image: 'alpine:3.24', pattern: 'jarvis-assistant-*.apk', export: '/export'}
          - {family: alpine, arch: aarch64, runner: ubuntu-24.04-arm, dockerfile: packaging/alpine/Dockerfile, image: 'alpine:3.24', pattern: 'jarvis-assistant-*.apk', export: '/export'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build in target distribution
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
          FAMILY: ${{ matrix.family }}
        run: |
          test "$(uname -m)" = "$ARCH"
          if [ "$FAMILY" = alpine ]; then
            docker build --progress=plain --build-arg JARVIS_TEST_PACKAGE_UPGRADE=1 -f "$DOCKERFILE" -t jarvis-package .
          else
            docker build --progress=plain -f "$DOCKERFILE" -t jarvis-package .
          fi
      - name: Export packages and checksums
        env:
          EXPORT_DIRECTORY: ${{ matrix.export || '/out' }}
        run: |
          mkdir -p dist/native
          docker run --rm -v "$PWD/dist/native:$EXPORT_DIRECTORY" jarvis-package
          cd dist/native
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Install, inspect and remove in clean target
        env:
          FAMILY: ${{ matrix.family }}
          IMAGE: ${{ matrix.image }}
          PATTERN: ${{ matrix.pattern }}
        run: |
          package=$(find dist/native -maxdepth 1 -type f -name "$PATTERN" -print -quit)
          test -n "$package"
          if [ "$FAMILY" = rhel ]; then
            docker run --rm -v "$PWD/dist/native:/packages:ro" -v "$PWD/scripts:/checks:ro" "$IMAGE" \
              sh -ec 'dnf -y install epel-release dnf-plugins-core; dnf config-manager --set-enabled crb; exec sh /checks/test-native-package.sh "$@"' \
              sh "$FAMILY" "/packages/$(basename "$package")"
          elif [ "$FAMILY" = alpine ]; then
            docker run --rm -v "$PWD/dist/native:/packages:ro" -v "$PWD/scripts:/checks:ro" "$IMAGE" \
              sh -ec 'find /packages -name "*.pub" -exec cp {} /etc/apk/keys/ \;; apk add --no-cache "$2"; exec sh /checks/test-native-package.sh "$@"' \
              sh "$FAMILY" "/packages/$(basename "$package")"
          else
            docker run --rm -v "$PWD/dist/native:/packages:ro" -v "$PWD/scripts:/checks:ro" "$IMAGE" \
              sh /checks/test-native-package.sh "$FAMILY" "/packages/$(basename "$package")"
          fi
      - name: Check signed Alpine revision update and user data preservation
        if: matrix.family == 'alpine'
        run: |
          test -f dist/native/jarvis-assistant-0.1.0-r0.apk
          test -f dist/native/jarvis-assistant-0.1.0-r1.apk
          docker run --rm -e JARVIS_APK_REQUIRE_SIGNATURE=1 \
            -v "$PWD/dist/native:/packages:ro" -v "$PWD/scripts:/checks:ro" alpine:3.24 \
            sh -ec 'find /packages -name "*.pub" -exec cp {} /etc/apk/keys/ \;; exec sh /checks/test-native-apk-upgrade.sh /packages/jarvis-assistant-0.1.0-r0.apk 0.1.0-r0 /packages/jarvis-assistant-0.1.0-r1.apk 0.1.0-r1'
      - name: Upload experimental package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-${{ matrix.family }}-${{ matrix.arch }}
          path: dist/native/
          retention-days: 7
          if-no-files-found: error
