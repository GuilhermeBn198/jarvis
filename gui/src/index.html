<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>jarvis</title>
  </head>
  <body>
    <div class="drag" data-tauri-drag-region></div>
    <div id="orb" class="orb" data-state="offline"></div>
    <div id="label" class="label">offline</div>
    <div id="menu" class="menu hidden">
      <button id="menu-mute" data-cmd="mute">Mudo</button>
      <button id="menu-pause" data-cmd="pause">Pausar</button>
      <button data-cmd="settings">Configurações ▸</button>
      <button id="brain" data-cmd="brain">Reiniciar cérebro</button>
      <button data-cmd="quit">Sair</button>
    </div>
    <div id="settings" class="settings hidden">
      <div class="settings-head">
        <span>Configurações</span>
        <button id="settings-close" title="fechar">×</button>
      </div>
      <label>Microfone ativo
        <select id="s-mic"></select>
      </label>
      <button id="s-mic-reload">Recarregar microfones</button>
      <label>Sensibilidade · VOICE_NOISE_DB
        <input id="s-noise" type="number" step="1" />
      </label>
      <button id="measure">Medir microfone</button>
      <div id="measure-out" class="measure-out"></div>
      <label>Silêncio p/ parar (s)
        <input id="s-silence" type="number" step="0.1" />
      </label>
      <label>Espera máx. de fala (s)
        <input id="s-wait" type="number" step="0.5" />
      </label>
      <label>Gravação máx. (s)
        <input id="s-max" type="number" step="1" />
      </label>
      <label>Duração mín. de fala (s)
        <input id="s-minspeech" type="number" step="0.1" />
      </label>
      <label>Modo de entrada
        <select id="s-input">
          <option value="auto">auto (por voz)</option>
          <option value="ptt">ptt (push-to-talk)</option>
          <option value="fixed">fixed (janela fixa)</option>
        </select>
      </label>
      <label>Voz (TTS)
        <select id="s-tts">
          <option value="piper">piper</option>
          <option value="sapi">sapi</option>
        </select>
      </label>
      <label class="row"><input id="s-stream" type="checkbox" /> Streaming de TTS</label>
      <div class="settings-actions">
        <button id="settings-save">Salvar</button>
        <button id="settings-restart">Salvar e reiniciar</button>
      </div>
      <div class="settings-hint">Aplicado ao reiniciar o cérebro.</div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
